[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Les routes /api/* sont servies par netlify/functions/api.mts (config.path) :
# les clés restent côté serveur.

# SPA : toutes les autres routes renvoient l'application
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://crests.football-data.org https://www.thesportsdb.com https://r2.thesportsdb.com https://media.api-sports.io; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://crests.football-data.org https://www.thesportsdb.com https://r2.thesportsdb.com https://media.api-sports.io; font-src 'self'; manifest-src 'self'; worker-src 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
